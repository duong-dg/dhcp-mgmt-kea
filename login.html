<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · Kea DHCP Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 12%,#1b5260,#101e34 64%);font:15px system-ui,sans-serif;color:#16273e}.card{width:min(100%,420px);background:#fff;border-radius:22px;padding:34px;box-shadow:0 24px 70px #0005}.brand{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#d9f4eb;color:#096957;font-size:23px;font-weight:800}.eyebrow{color:#096957;font-weight:750;font-size:12px;letter-spacing:.11em;margin:18px 0 4px}h1{font-size:29px;margin:0 0 8px}p{color:#52647a;margin:0 0 24px}label{display:block;font-weight:650;margin-top:15px}input,button{width:100%;font:inherit;padding:12px;border-radius:9px}input{margin-top:6px;border:1px solid #b7c6d7}button{margin-top:20px;border:0;background:#096957;color:#fff;font-weight:700;cursor:pointer}input:focus-visible,button:focus-visible{outline:3px solid #51c1ab;outline-offset:2px}.error{color:#a12626;margin-top:12px}.error:empty{display:none}
</style>
</head>
<body><main class="card">
<div class="brand" aria-hidden="true">K</div>
<div class="eyebrow">QUẢN TRỊ MẠNG</div>
<h1>Kea DHCP Manager</h1>
<p>Đăng nhập để quản lý DHCP và xem địa chỉ IP theo VLAN.</p>
<form method="post" action="/login" {{password-hidden}}>
<label>Tên đăng nhập<input name="username" autocomplete="username" required autofocus></label>
<label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label>

<button>Đăng nhập</button>
</form>
<form method="post" action="/login/otp" {{otp-hidden}}>
<p>Nhập mã đã gửi đến hộp thư quản trị.</p>
<label>Mã OTP<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label>
<button>Xác minh và đăng nhập</button>
<p><a href="/login">Quay lại đăng nhập</a></p>
</form>
<div class="error" role="alert">{{error}}</div>
</main></body>
</html>
