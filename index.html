<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHA Network Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#14243c;font:15px system-ui,sans-serif}header{background:#12243b;color:white;padding:24px max(5vw,20px)}header small{color:#9de1d2;letter-spacing:.13em}h1{margin:5px 0}main{max-width:1200px;margin:auto;padding:25px 20px}section,details.form{background:white;border:1px solid #dce4ee;border-radius:14px;padding:20px;margin:15px 0}.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h2,p{margin:0 0 8px}.stats{display:flex;gap:30px;flex-wrap:wrap}.stats strong{font-size:28px;display:block}button{background:#096957;color:white;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:default}input,textarea,select{display:block;width:100%;padding:10px;border:1px solid #b8c6d6;border-radius:7px;margin-top:5px;font:inherit}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}summary{cursor:pointer;font-weight:600}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:12px;border-bottom:1px solid #e2e8f0;vertical-align:top}th{white-space:nowrap;background:#f8fafc}td li{white-space:nowrap}#notice{white-space:pre-wrap;color:#8a3912}#result{margin-top:12px}.muted{color:#506078}
.lease-table{margin-top:8px;font-size:13px;min-width:485px}.lease-table th,.lease-table td{padding:8px;white-space:nowrap}.lease-table td:first-child{font-family:monospace;color:#096957}.logout{display:block;margin:0}.logout button{background:#ffffff20}#empty{margin-top:12px}.capacity{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}.capacity span{background:#edf7f5;padding:8px 12px;border-radius:8px}.lease-details{margin:0}.excluded{margin:8px 0}.lease-details summary{color:#096957}.capacity progress{width:100%;accent-color:#096957}[hidden]{display:none!important}header{background:linear-gradient(115deg,#102137,#173d4c)}header h1{font-size:clamp(24px,4vw,36px)}main{max-width:1160px}.stats{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.stats>div{background:#f1f7fa;border-radius:12px;padding:13px 16px}.stats strong{font-variant-numeric:tabular-nums}.vlan-link,.back{color:#096957;font-weight:700;text-decoration:none}.vlan-link:hover,.back:hover{text-decoration:underline}.vlan-link{display:inline-block;padding:4px 0}.vlan-list tbody tr:hover{background:#f4faf9}.usage{min-width:140px}.usage progress{display:block;width:100%;height:9px;margin-top:6px;accent-color:#096957}.usage small{color:#506078}.detail-title{margin-top:12px;font-size:30px}.range-list{margin:6px 0 0;padding-left:20px}.lease-table{font-size:14px}.lease-table th,.lease-table td{padding:12px}.lease-table tbody tr:nth-child(even){background:#f8fafc}.notice{padding:12px;background:#fff5e8;border-radius:8px}.notice:empty{display:none}
.reservation-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.reservation-actions button{font-size:12px;padding:6px 9px}.reservation-badge{display:inline-block;background:#dbf4eb;color:#075848;border-radius:14px;padding:4px 8px;font-size:12px;font-weight:700}.reservation-badge.waiting{background:#fff0d7;color:#764200}</style>
<header class="bar"><div><small>QUẢN TRỊ MẠNG / DHCPV4</small><h1>GHA Network Manager</h1><div>Theo dõi subnet và địa chỉ đã cấp trên cặp máy chủ HA</div></div><form class="logout" method="post" action="/logout"><button>Đăng xuất</button></form></header>
<main>
<section class="bar">
<div class="stats" id="overview-stats"><div><strong id="count">—</strong>Subnet</div><div><strong id="total">—</strong>Lease đang hoạt động</div><div><strong id="health">—</strong>Nguồn dữ liệu</div></div>
<a class="back" id="back" href="/" hidden>← Dashboard</a><label>Cửa sổ sFlow<select id="traffic-minutes"><option value="1" selected>1 phút</option><option value="5">5 phút</option><option value="15">15 phút</option></select></label><button id="refresh">Làm mới</button>
</section>
<p id="notice" class="notice" role="status"></p>
<details class="form" id="editor">
<summary>Lập kế hoạch DHCP cho VLAN trên trunk</summary>
<form id="form">
<label>VLAN ID<input name="vlan" type="number" min="1" max="4094" required></label>
<label>Subnet CIDR<input name="cidr" placeholder="192.168.20.0/24" required></label>
<label>Gateway<input name="gateway" placeholder="192.168.20.1" required></label>
<label>IP bắt đầu cấp DHCP<input name="start" placeholder="192.168.20.50" required></label>
<label>IP kết thúc cấp DHCP<input name="end" placeholder="192.168.20.200" required></label>
<label>DNS (phân tách bằng dấu phẩy)<input name="dns"></label>
<label>IP node phụ<input name="standby" required></label>
<label>IP node chính<input name="primary" required></label>
<label style="grid-column:1/-1">IP hoặc dải không cấp (tùy chọn)<textarea name="exclude" rows="2" placeholder="192.168.20.55, 192.168.20.80 - 192.168.20.89"></textarea><small class="muted">Nhập từng IP hoặc dải trong vùng dự kiến cấp DHCP, cách nhau bằng dấu phẩy hoặc xuống dòng. Web tự chừa gateway và IP hai node.</small></label>
<button id="save">Xem cấu hình dự kiến</button>
</form>
<p id="result" role="status"></p>
<pre id="plan" class="scroll"></pre>
<a class="back" id="download-plan" hidden>Tải cấu hình VLAN (.json)</a>
<button id="stage-vlan" type="button" hidden>Lưu kế hoạch chờ áp dụng</button>
</details>
<section id="vlan-detail" hidden></section>
<section>
<div class="bar"><div><h2 id="list-title">Tổng quan VLAN</h2><p id="list-description" class="muted">Chọn một VLAN để xem dải cấp phát và danh sách IP.</p></div><label id="search-label">Tìm theo VLAN, subnet hoặc thiết bị<input id="filter" type="search" placeholder="Nhập từ khóa"></label></div>
<p id="reservation-status" class="muted" role="status"></p>
<div class="scroll"><table id="data-table" class="vlan-list"><thead><tr id="headings"></tr></thead><tbody id="rows"></tbody></table></div>
<p id="empty" class="muted" role="status"></p>

</section>
</main>
<script>
const el = id => document.getElementById(id);
let rows = [];
let partial = false;
let pendingReservation = null;
let autoReservations = false;
let reservationBusy = null;
let editingRow = null;
let sflowMinutes = 1;
try {
  const saved = Number(localStorage.getItem('gha-sflow-minutes'));
  if ([1, 5, 15].includes(saved)) el('traffic-minutes').value = String(saved);
} catch {}
let ipRates = new Map();

function rateText(value) {
  if (typeof value !== 'number' || !Number.isFinite(value)) return '—';
  if (value >= 1000000000) return (value / 1000000000).toFixed(2) + ' Gbps';
  if (value >= 1000000) return (value / 1000000).toFixed(2) + ' Mbps';
  if (value >= 1000) return (value / 1000).toFixed(2) + ' Kbps';
  return value.toFixed(0) + ' bps';
}

function appendRates(cell, rates) {
  if (!rates) { cell.textContent = '—'; return; }
  cell.append(textElement('div', '↓ ' + rateText(rates.internet_download_bps) +
    ' · ↑ ' + rateText(rates.internet_upload_bps)));
  cell.append(textElement('small', rates.status === 'fresh' ? 'Mẫu mới · TB ' + sflowMinutes + ' phút' :
    'Dữ liệu cũ/chưa xác định · TB ' + sflowMinutes + ' phút', 'muted'));
}
const selection = new URLSearchParams(location.search);
const isDetail = location.pathname === '/vlan';
el('back').hidden = !isDetail;
el('overview-stats').hidden = isDetail;
el('editor').hidden = isDetail;

function matches(query, values) {
  return values.some(value => String(value ?? '').toLowerCase().includes(query));
}

function leaseFields(lease) {
  return [lease['ip-address'], lease.hostname, lease['hw-address']];
}

function vlanName(row) {
  return row.vlan == null ? 'Chưa gán VLAN' : 'VLAN ' + row.vlan;
}

function textElement(tag, content, className) {
  const element = document.createElement(tag);
  element.textContent = content;
  if (className) element.className = className;
  return element;
}

function usage(row) {
  const {used, size} = row.capacity;
  const bar = document.createElement('div');
  bar.className = 'usage';
  const percent = size ? Math.round(used * 100 / size) : 0;
  bar.append(textElement('small', size ? used + ' / ' + size + ' · ' + percent + '%' + (partial ? '*' : '') : 'Chưa có pool'));
  if (size) {
    const progress = document.createElement('progress');
    progress.max = size;
    progress.value = used;
    progress.setAttribute('aria-label', 'IP đang cấp trong pool của ' + vlanName(row));
    bar.append(progress);
  }
  return bar;
}

function detail(row) {
  const panel = el('vlan-detail');
  panel.replaceChildren();
  panel.hidden = !row;
  if (!row) return;
  panel.append(textElement('h2', vlanName(row), 'detail-title'));
  panel.append(textElement('p', row.cidr + ' · Subnet ID ' + row.id, 'muted'));
  const stats = document.createElement('div');
  stats.className = 'stats';
  const {size, used, remaining, excluded} = row.capacity;
  for (const [value, label] of [[row.leases.length + (partial ? '*' : ''), 'Lease đang hoạt động'],
    [size, 'IP trong pool'], [used + (partial ? '*' : ''), 'Đang cấp trong pool'],
    [partial ? '—' : remaining, 'Chưa có lease hoạt động']]) {
    const card = document.createElement('div');
    card.append(textElement('strong', value), textElement('span', label));
    stats.append(card);
  }
  const capacity = document.createElement('div');
  capacity.className = 'capacity';
  capacity.append(usage(row));
  panel.append(stats, capacity);
  if (row.traffic) {
    const card = document.createElement('div');
    card.append(textElement('strong', row.traffic.observed_ips ?? '—'), textElement('span', 'IP có lưu lượng · sFlow'));
    stats.append(card);
    const seen = new Date(row.traffic.last_seen);
    const timestamp = row.traffic.last_seen && !Number.isNaN(seen.getTime()) ?
      seen.toLocaleString('vi-VN') : 'Chưa có thời điểm quan sát';
    panel.append(textElement('p', 'sFlow quan sát cuối · ' + timestamp, 'muted'));
    if (row.traffic.rates) {
      const rates = row.traffic.rates;
      const block = document.createElement('section');
      block.append(textElement('h3', 'Lưu lượng VLAN · trung bình ' + sflowMinutes + ' phút'));
      appendRates(block, rates);
      block.append(textElement('p', 'Nội bộ · ↓ ' + rateText(rates.internal_download_bps) +
        ' · ↑ ' + rateText(rates.internal_upload_bps), 'muted'));
      if (rates.sampling_applied === 'verify_collector') {
        block.append(textElement('p', 'Nguồn sFlow chưa xác nhận hệ số sampling. Số liệu tốc độ cần đối chiếu.', 'notice'));
      }
      panel.append(block);
    }
  }
  const edit = textElement('button', 'Chỉnh dải DHCP và IP không cấp');
  edit.type = 'button';
  const editBlock = partial ? 'Chưa đủ dữ liệu từ hai node. Xem thông báo lỗi phía trên và bấm Làm mới.' :
    row.nodes.length !== 2 ? 'Subnet này chưa được thấy trên cả hai node Kea. Cần đối chiếu cấu hình trước khi chỉnh.' :
    !row.pools.length ? 'Subnet chưa có pool DHCP để chỉnh.' : '';
  edit.disabled = Boolean(editBlock);
  if (editBlock) {
    edit.title = editBlock;
    panel.append(textElement('p', editBlock, 'notice'));
  }
  edit.onclick = () => {
    editingRow = row;
    el('editor').hidden = false;
    el('editor').open = true;
    el('editor').querySelector('summary').textContent = 'Chỉnh dải DHCP · ' + vlanName(row);
    el('form').reset();
    const fields = el('form').elements;
    fields.vlan.value = row.vlan ?? '';
    fields.cidr.value = row.cidr;
    fields.gateway.value = row.gateway || '';
    fields.gateway.readOnly = Boolean(row.gateway);
    fields.vlan.readOnly = row.vlan != null;
    fields.cidr.readOnly = true;
    const bounds = row.pools.map(pool => {
      if (pool.includes('-')) return pool.split('-').map(value => value.trim());
      const [address, prefix] = pool.split('/');
      const start = address.split('.').reduce((value, octet) => value * 256 + Number(octet), 0);
      const end = start + 2 ** (32 - Number(prefix)) - 1;
      return [address, [24, 16, 8, 0].map(shift => Math.floor(end / 2 ** shift) % 256).join('.')];
    });
    const numeric = address => address.split('.').reduce((value, octet) => value * 256 + Number(octet), 0);
    bounds.sort((a, b) => numeric(a[0]) - numeric(b[0]));
    fields.start.value = bounds[0][0];
    fields.end.value = bounds[bounds.length - 1][1];
    fields.exclude.value = row.capacity.excluded.filter(([first, last]) =>
      numeric(first) >= numeric(fields.start.value) && numeric(last) <= numeric(fields.end.value)
    ).map(([first, last]) => first === last ? first : first + ' - ' + last).join('\n');
    fields.dns.closest('label').hidden = true;
    el('result').textContent = 'Nhập IP của hai node trên VLAN để web chừa khỏi pool. IP đang có lease vẫn có thể được thiết bị dùng tới khi hết hạn.';
    clearDownload();
    el('stage-vlan').hidden = true;
    previewedPlan = null;
    el('plan').textContent = '';
    el('editor').scrollIntoView({behavior: 'smooth'});
  };
  panel.append(edit);
  for (const [title, ranges] of [
    ['Dải cấp phát động', row.pools],
    ['Dải ngoài pool động', excluded.map(([start, end]) => start === end ? start : start + ' – ' + end)]
  ]) {
    const block = document.createElement('details');
    block.className = 'excluded';
    block.open = true;
    block.append(textElement('summary', title + ' · ' + ranges.length + ' dải'));
    const list = document.createElement('ul');
    list.className = 'range-list';
    for (const range of ranges) list.append(textElement('li', range));
    if (ranges.length) block.append(list);
    panel.append(block);
  }
}

function render() {
  const query = el('filter').value.trim().toLowerCase();
  const selected = isDetail && rows.find(row =>
    String(row.id) === selection.get('id') && row.cidr === selection.get('subnet'));
  const titles = isDetail ? ['Địa chỉ IP', 'Hostname', 'MAC', 'Hết hạn', 'Internet ↓ / ↑', 'Nội bộ ↓ / ↑', 'Quan sát cuối', 'Giữ IP'] :
    ['VLAN', 'Subnet', 'Lease hoạt động', 'IP có lưu lượng · sFlow', 'Internet ↓ / ↑', 'Sử dụng pool', 'Chưa có lease trong pool'];
  el('headings').replaceChildren(...titles.map(title => textElement('th', title)));
  el('rows').replaceChildren();
  el('data-table').className = isDetail ? 'lease-table' : 'vlan-list';
  el('list-title').textContent = isDetail ? 'Địa chỉ IP đã cấp' : 'Tổng quan VLAN';
  el('list-description').textContent = isDetail ?
    'Tốc độ theo IP, trung bình ' + sflowMinutes + ' phút. Tối đa 200 IP từ API sFlow; ô — là chưa có số liệu. IP có thể được cấp cho thiết bị khác trong cửa sổ đo.' :
    'Chọn VLAN để xem thiết bị và lưu lượng. Tốc độ Internet trung bình ' + sflowMinutes + ' phút; hệ số sampling cần xác nhận ở nguồn sFlow.';
  if (isDetail) {
    const devices = new Map();
    if (selected) {
      for (const lease of selected.leases) {
        const [ip, hostname, mac] = leaseFields(lease);
        const expiry = new Date((lease.cltt + lease['valid-lft']) * 1000);
        devices.set(ip + '|' + String(mac ?? '').toLowerCase(), {ip, mac, hostname, expiry, active: true});
      }
      for (const reservation of selected.reservations) {
        const key = reservation.ip + '|' + reservation.mac;
        const device = devices.get(key) || {ip: reservation.ip, mac: reservation.mac};
        device.reservation = reservation;
        devices.set(key, device);
      }
      const knownIps = new Set([...devices.values()].map(device => device.ip));
      for (const ip of ipRates.keys()) {
        if (!knownIps.has(ip)) devices.set(ip + '|sflow', {ip});
      }
      const pending = pendingReservation;
      if (pending?.id === selected.id && pending.subnet === selected.cidr) {
        const ip = pending.reservation['ip-address'];
        const mac = pending.reservation['hw-address'];
        const key = ip + '|' + mac;
        const device = devices.get(key) || {ip, mac};
        const nodeCount = device.reservation?.nodes.length || 0;
        if (pending.kind === 'reservation' ? nodeCount < 2 : nodeCount > 0 || partial) {
          device.pending = pending.kind;
          devices.set(key, device);
        }
      }
    }
    let count = 0;
    for (const device of devices.values()) {
      const {ip, mac, hostname, expiry, active, reservation, pending} = device;
      if (!matches(query, [ip, mac, hostname])) continue;
      count++;
      const tr = el('rows').insertRow();
      for (const value of [ip, hostname, mac, expiry?.toLocaleString('vi-VN')]) {
        tr.insertCell().textContent = value || '—';
      }
      const rates = ipRates.get(ip);
      appendRates(tr.insertCell(), rates);
      tr.insertCell().textContent = rates ? '↓ ' + rateText(rates.internal_download_bps) +
        ' · ↑ ' + rateText(rates.internal_upload_bps) : '—';
      const seen = rates?.last_seen ? new Date(rates.last_seen) : null;
      tr.insertCell().textContent = seen && !Number.isNaN(seen.getTime()) ? seen.toLocaleString('vi-VN') : '—';
      const actions = document.createElement('div');
      actions.className = 'reservation-actions';
      tr.insertCell().append(actions);
      const nodes = reservation?.nodes.length || 0;
      const label = pending === 'reservation' ? 'Chờ giữ IP' : pending === 'remove-reservation' ? 'Chờ bỏ giữ' :
        nodes === 2 ? 'Đang giữ · 2/2 node' : nodes === 1 ? 'Có giữ · 1/2 node' : '';
      if (label) actions.append(textElement('span', label, 'reservation-badge' + (pending || nodes < 2 ? ' waiting' : '')));
      if (pending || nodes === 2 ||
          (!nodes && active && /^(?:[0-9a-f]{2}:){5}[0-9a-f]{2}$/i.test(mac))) {
        const title = pending ? 'Hủy yêu cầu chờ' : nodes ? 'Bỏ giữ' : 'Giữ IP theo MAC';
        const deviceKey = ip + '|' + String(mac).toLowerCase();
        const processing = reservationBusy === deviceKey;
        const button = textElement('button', processing ? 'Đang xử lý…' : title);
        button.type = 'button';
        button.disabled = processing || (partial && !pending);
        if (partial && !pending) button.title = 'Cần dữ liệu đầy đủ từ hai node.';
        button.onclick = async () => {
          if (reservationBusy !== null) {
            el('reservation-status').textContent = 'Đang xử lý một IP. Vui lòng đợi thao tác này hoàn tất.';
            return;
          }
          const prompt = title + ' cho ' + ip + ' · ' + mac + '?' +
            (pending || autoReservations ? '' : ' Thao tác này thay bản chờ trước đó.');
          if (!confirm(prompt)) return;
          const kind = pending || (nodes ? 'remove-reservation' : 'reservation');
          const plan = {kind, id: selected.id, subnet: selected.cidr, ip, mac};
          reservationBusy = deviceKey;
          el('refresh').disabled = true;
          render();
          el('reservation-status').textContent = 'Đang xử lý ' + ip + '…';
          try {
            const ok = await stage(plan, 'reservation-status',
              pending ? '/api/cancel-reservation' : autoReservations ? '/api/apply-reservation' : '/api/stage-plan');
            if (!ok) return;
            if (pending) {
              pendingReservation = null;
            } else if (autoReservations) {
              const normalizedMac = mac.toLowerCase();
              selected.reservations = selected.reservations.filter(item => item.ip !== ip || item.mac !== normalizedMac);
              if (kind === 'reservation') selected.reservations.push({ip, mac: normalizedMac, nodes: [1, 2]});
            } else {
              pendingReservation = {kind, id: selected.id, subnet: selected.cidr,
                reservation: {'ip-address': ip, 'hw-address': mac.toLowerCase()}};
            }
          } finally {
            reservationBusy = null;
            el('refresh').disabled = false;
            render();
          }
        };
        actions.append(button);
      }
    }
    el('empty').textContent = count ? '' : selected ?
      'Không có lease hoặc IP giữ chỗ phù hợp.' : 'Không tìm thấy subnet này trong dữ liệu hiện có.';
    return;
  }
  const visible = rows.filter(row => matches(query, [vlanName(row), row.cidr]) ||
    row.leases.some(lease => matches(query, leaseFields(lease))));
  for (const row of visible) {
    const tr = el('rows').insertRow();
    const link = textElement('a', vlanName(row) + ' ↗', 'vlan-link');
    link.href = '/vlan?' + new URLSearchParams({id: row.id, subnet: row.cidr});
    tr.insertCell().append(link);
    tr.insertCell().textContent = row.cidr;
    tr.insertCell().textContent = row.leases.length + (partial ? '*' : '');
    const trafficCell = tr.insertCell();
    trafficCell.textContent = row.traffic?.observed_ips ?? '—';
    if (row.traffic?.last_seen) trafficCell.title = 'Quan sát cuối: ' + row.traffic.last_seen;
    appendRates(tr.insertCell(), row.traffic?.rates);
    tr.insertCell().append(usage(row));
    tr.insertCell().textContent = partial ? '—' : row.capacity.remaining;
  }
  el('empty').textContent = visible.length ? '' : 'Không có subnet phù hợp để hiển thị.';
}
async function load() {
  el('refresh').disabled = true;
  el('traffic-minutes').disabled = true;
  const requestedMinutes = Number(el('traffic-minutes').value);
  try {
    const response = await fetch('/api/dashboard?minutes=' + requestedMinutes, {cache: 'no-store'});
    if (response.status === 401) { location.assign('/login'); return; }
    if (!response.ok) throw new Error('Không thể tải dashboard.');
    const data = await response.json();
    sflowMinutes = requestedMinutes;
    rows = data.rows;
    pendingReservation = data.pending_reservation;
    autoReservations = data.auto_reservations;
    partial = Boolean(data.errors.length);
    el('count').textContent = rows.length;
    el('total').textContent = data.errors.length ? data.total + '*' : data.total;
    el('health').textContent = data.errors.length ? 'Thiếu dữ liệu' : 'Đủ 2 node';
    el('notice').textContent = data.errors.length ? '* Số lease theo dữ liệu hiện có.\n' + data.errors.join('\n') : '';
    if (data.traffic_error) el('notice').textContent += '\n' + data.traffic_error;
    if (isDetail) detail(rows.find(row => String(row.id) === selection.get('id') && row.cidr === selection.get('subnet')));
    ipRates = new Map();
    render();
    if (isDetail) {
      const selected = rows.find(row => String(row.id) === selection.get('id') && row.cidr === selection.get('subnet'));
      if (selected?.vlan != null) {
        try {
          const ratesResponse = await fetch('/api/traffic/ips?vlan_id=' + encodeURIComponent(selected.vlan) + '&minutes=' + requestedMinutes, {cache: 'no-store'});
          if (ratesResponse.status === 401) { location.assign('/login'); return; }
          if (!ratesResponse.ok) throw new Error('Chưa tải được băng thông từng IP.');
          const ratesData = await ratesResponse.json();
          ipRates = new Map(ratesData.items.map(item => [item.ip, item]));
          render();
        } catch (error) {
          el('notice').textContent += '\n' + error.message;
        }
      }
    }
  } catch (error) {
    el('notice').textContent = error.message;
  } finally {
    el('refresh').disabled = false;
    el('traffic-minutes').disabled = false;
  }
}
el('refresh').onclick = load;
el('traffic-minutes').onchange = () => {
  try { localStorage.setItem('gha-sflow-minutes', el('traffic-minutes').value); } catch {}
  load();
};
el('filter').oninput = render;
let previewedPlan;
let planUrl;
function clearDownload() {
  if (planUrl) URL.revokeObjectURL(planUrl);
  planUrl = null;
  el('download-plan').removeAttribute('href');
  el('download-plan').hidden = true;
}
el('form').oninput = () => {
  previewedPlan = null;
  clearDownload();
  el('stage-vlan').hidden = true;
  el('plan').textContent = '';
  el('result').textContent = '';
};
async function stage(plan, statusId, endpoint = '/api/stage-plan') {
  try {
    const response = await fetch(endpoint, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(plan)
    });
    if (response.status === 401) { location.assign('/login'); return; }
    const result = await response.json();
    el(statusId).textContent = result.message || result.error;
    return response.ok;
  } catch (error) {
    el(statusId).textContent = error.message;
  }
}
el('stage-vlan').onclick = async () => {
  if (!previewedPlan || !confirm('Lưu bản này và thay kế hoạch chờ trước đó?')) return;
  el('stage-vlan').disabled = true;
  try {
    await stage(previewedPlan, 'result');
  } finally {
    el('stage-vlan').disabled = false;
  }
};
el('form').onsubmit = async event => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(event.target));
  if (editingRow) {
    data.kind = 'update-pools';
    data.id = editingRow.id;
    data.previous_pools = editingRow.pools;
  }
  el('save').disabled = true;
  clearDownload();
  el('plan').textContent = '';
  try {
    const response = await fetch('/api/vlan-plan', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    el('result').textContent = 'Cấu hình dự kiến cho hai node.';
    el('plan').textContent = JSON.stringify(result, null, 2);
    const file = new Blob([JSON.stringify(result, null, 2) + '\n'], {type: 'application/json'});
    planUrl = URL.createObjectURL(file);
    el('download-plan').href = planUrl;
    el('download-plan').download = 'vlan-' + data.vlan + '.json';
    el('download-plan').hidden = false;
    previewedPlan = data;
    el('stage-vlan').hidden = false;
  } catch (error) {
    el('result').textContent = error.message;
  } finally {
    el('save').disabled = false;
  }
};
load();
</script>
</html>
